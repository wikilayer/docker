name: Publish Docker image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download and verify release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          version="${RELEASE_TAG#v}"
          mkdir -p .build/linux/amd64 .build/linux/arm64 dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          for arch in amd64 arm64; do
            archive="wikilayer_${version}_linux_${arch}.tar.gz"
            test -s "dist/$archive"
            test -s "dist/$archive.sha256"
            (cd dist && sha256sum --check "$archive.sha256")
            tar -xzf "dist/$archive" -C ".build/linux/$arch" wikilayer
            test -x ".build/linux/$arch/wikilayer"
          done
          test "$(.build/linux/amd64/wikilayer version)" = "$version"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.event.release.tag_name }}
          tags: |
            ghcr.io/wikilayer/wikilayer:${{ github.event.release.tag_name }}
            ghcr.io/wikilayer/wikilayer:latest
