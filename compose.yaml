services:
  wikilayer:
    image: ghcr.io/wikilayer/wikilayer:${WIKILAYER_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wikilayer:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/wikilayer?sslmode=disable
      STORAGE_DIR: /var/lib/wikilayer/uploads
    ports:
      - "127.0.0.1:38731:8080"
    volumes:
      - uploads:/var/lib/wikilayer/uploads

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: wikilayer
      POSTGRES_USER: wikilayer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikilayer -d wikilayer"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads:
